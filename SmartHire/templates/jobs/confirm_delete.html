{% extends 'base.html' %}
{% block title %}Delete Job{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 text-center">
        <i class="bi bi-trash display-4 text-danger mb-3"></i>
        <h5 class="fw-bold">Delete Job Posting?</h5>
        <p class="text-muted">Are you sure you want to delete <strong>{{ job.title }}</strong>? This cannot be undone.</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
          <a href="{% url 'job_detail' job.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
